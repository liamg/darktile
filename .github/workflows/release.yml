name: Release
on:
  push:
    tags:
      - v*
  # A tag is the only other trigger, so without this the release path can never
  # be exercised without publishing something. Dispatching builds a snapshot.
  workflow_dispatch:

# Unlike the test workflow this does not build inside the flake devShell: a
# binary linked there resolves its libraries from /nix/store and would not run
# on an ordinary distro. ebiten still needs cgo and the X11 headers on Linux.

jobs:
  build:
    name: Releasing Darktile
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GoReleaser takes the version from the tag, the Nix build takes it from
      # VERSION. Nothing keeps the two in sync on its own, and the failure is
      # silent: the same commit ships two different version strings.
      - name: Check VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared=$(cat VERSION)
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($declared)" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: "^1.26"
      - run: go version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
